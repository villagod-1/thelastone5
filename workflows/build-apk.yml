name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'

    - name: Get dependencies
      run: |
        cd the_last_one
        flutter pub get

    - name: Generate Hive adapters
      run: |
        cd the_last_one
        flutter pub run build_runner build --delete-conflicting-outputs

    - name: Build APK
      run: |
        cd the_last_one
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: the-last-one-apk
        path: the_last_one/build/app/outputs/flutter-apk/app-release.apk
